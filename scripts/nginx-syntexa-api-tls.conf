# HTTPS — api.syntexabr.com.br (Let's Encrypt).
# O upstream syntexa_api_upstream vem de nginx-syntexa-api.conf (carregado no mesmo http{}).
# listen 443 em IPv4 e IPv6 (evita curl 127.0.0.1 falhar quando só existia [::]:443).
# Instalado por setup_nginx_api.sh quando /etc/letsencrypt/live/.../fullchain.pem existe.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.syntexabr.com.br;

    ssl_certificate /etc/letsencrypt/live/api.syntexabr.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.syntexabr.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://syntexa_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
