name = "syntexa-gateway"
main = "gateway_worker.js"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "syntexabr.com.br/*", zone_name = "syntexabr.com.br" },
  { pattern = "www.syntexabr.com.br/*", zone_name = "syntexabr.com.br" },
  { pattern = "api.syntexabr.com.br/*", zone_name = "syntexabr.com.br" }
]

# ── BACKENDS ─────────────────────────────────────────────
# Railway = Core Backend (auth, banco, orquestração, streaming)
# AWS GPU = Cluster de inferência pesada (chat, embeddings, vision, voice)
# Local = Infra híbrida de fallback (Ollama, RTX, edge inference)
[vars]
BACKEND_BASE_URL = "https://syntexa-backend-production.up.railway.app"
AWS_BASE_URL = "http://98.94.86.193:8000"
LOCAL_BASE_URL = ""
# V47 — PRODUÇÃO: Frontend servido direto em syntexabr.com.br
# (Cloudflare Pages roteado via CNAME para pages.dev)
FRONTEND_BASE_URL = "https://syntexabr.com.br"
# FRONTEND_PAGES_URL: URL PRODUCTION do deployment no Cloudflare Pages
# Use syntexa-frontend.pages.dev para production (não hash preview)
FRONTEND_PAGES_URL = "https://syntexa-frontend.pages.dev"

# ── EDGE SECURITY ──────────────────────────────────────
REQUIRE_CLOUDFLARE = "true"
JWT_EDGE_VERIFY = "false"
HMAC_VERIFY = "true"
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_WINDOW = "60"
RATE_LIMIT_MAX = "200"
PROXY_TIMEOUT_MS = "45000"

# ── KV BINDING (rate limiting + sessions) ──────────────
# O rate limiting do edge depende deste binding. Para ativar:
#   1. wrangler kv:namespace create "VEREDA_KV"
#   2. Copie o id retornado abaixo e descomente as 4 linhas.
# [[kv_namespaces]]
# binding = "VEREDA_KV"
# id = "<substituir-pelo-id-real-do-kv>"

# ── SECRETS (configurar via: wrangler secret put <nome>) ─
# VEREDA_SECRET_KEY
# AI_WORKER_API_KEY
# LOCAL_AI_API_KEY



