apiVersion: v1
kind: Service
metadata:
  name: syntexa-backend
  namespace: syntexa
  labels:
    app: syntexa-backend
spec:
  type: ClusterIP
  selector:
    app: syntexa-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: syntexa-ai-worker
  namespace: syntexa
  labels:
    app: syntexa-ai-worker
spec:
  type: ClusterIP
  selector:
    app: syntexa-ai-worker
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: syntexa-local-hybrid
  namespace: syntexa
  labels:
    app: syntexa-local-hybrid
spec:
  type: ClusterIP
  selector:
    app: syntexa-local-hybrid
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: syntexa-redis
  namespace: syntexa
  labels:
    app: syntexa-redis
spec:
  type: ClusterIP
  selector:
    app: syntexa-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
