apiVersion: v1
kind: ConfigMap
metadata:
  name: syntexa-config
  namespace: syntexa
data:
  ENVIRONMENT: "production"
  GATEWAY_MODE: "false"
  AI_ROUTER_FALLBACK_ENABLED: "true"
  AI_ROUTER_TIMEOUT_SEC: "120.0"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_MAX: "200"
  CHAT_MAX_MESSAGES: "48"
  CHAT_MAX_MESSAGE_CHARS: "12000"
  CHAT_MAX_OUTPUT_TOKENS_DEFAULT: "4096"
  CHAT_MAX_MODEL_TOKENS: "8192"
  REDIS_CHAT_CACHE_TTL_SEC: "120"
  GLOBAL_MAX_CONCURRENT_LLM: "32"
  PER_USER_MAX_CONCURRENT_LLM: "5"
  SLOT_TIMEOUT_GOV_SEC: "300"
  SLOT_TIMEOUT_AUTH_SEC: "120"
  SLOT_TIMEOUT_PUBLIC_SEC: "75"
  SESSION_CREATE_PER_IP_HOUR: "40"
  MEDIA_STRICT_REAL_PROVIDERS: "true"
  MEDIA_USE_POLLINATIONS: "true"
  MEDIA_GENERATION_CACHE_ENABLED: "true"
  MEDIA_GENERATION_CACHE_TTL_SEC: "300"
  MEDIA_ASYNC_RATE_LIMIT_ENABLED: "true"
  REQUIRE_CLOUDFLARE: "true"
