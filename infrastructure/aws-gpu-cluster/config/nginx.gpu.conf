user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs format
    log_format vereda '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log vereda;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream definitions
    upstream vllm_backend {
        server vllm:8000 max_fails=3 fail_timeout=30s;
    }

    upstream embeddings_backend {
        server embeddings:8001 max_fails=3 fail_timeout=30s;
    }

    upstream vision_backend {
        server vision:8002 max_fails=3 fail_timeout=30s;
    }

    upstream voice_backend {
        server voice:8003 max_fails=3 fail_timeout=30s;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx-gpu"}';
            add_header Content-Type application/json;
        }

        # vLLM LLM API
        location /v1/chat/completions {
            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /v1/models {
            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Embeddings
        location /v1/embeddings {
            proxy_pass http://embeddings_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Vision
        location /v1/vision/ {
            proxy_pass http://vision_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            client_max_body_size 20M;
        }

        # Voice
        location /v1/voice/ {
            proxy_pass http://voice_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            client_max_body_size 50M;
        }

        # Default
        location / {
            return 404 '{"detail":"Not Found"}';
            add_header Content-Type application/json;
        }
    }
}
