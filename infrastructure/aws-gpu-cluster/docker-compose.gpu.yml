# ============================================================
# VEREDA / SYNTEXA — AWS GPU CLUSTER
# Docker Compose para EC2 GPU (g5.xlarge / g5.2xlarge / p4d)
# ============================================================
version: "3.9"

services:
  # ── vLLM LLM Server ──────────────────────────────────────
  vllm:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: syntexa-vllm
    runtime: nvidia
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${MODEL_NAME:-microsoft/DialoGPT-medium}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-4096}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.9}
      - ENABLE_PREFIX_CACHING=${ENABLE_PREFIX_CACHING:-1}
      - VLLM_WORKER_MULTIPROC_METHOD=${VLLM_WORKER_MULTIPROC_METHOD:-spawn}
    volumes:
      - vllm-models:/root/.cache/huggingface
      - ./config:/app/config:ro
    command: >
      python -m vllm.entrypoints.openai.api_server
      --model ${MODEL_NAME:-microsoft/DialoGPT-medium}
      --max-model-len ${MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.9}
      --enable-prefix-caching
      --port 8000
      --host 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - gpu-cluster
    restart: unless-stopped

  # ── Embeddings Server ────────────────────────────────────
  embeddings:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: syntexa-embeddings
    runtime: nvidia
    ports:
      - "8001:8001"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_MODE=embeddings
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - vllm-models:/root/.cache/huggingface
    command: >
      uvicorn main:embeddings_app
      --host 0.0.0.0
      --port 8001
      --workers 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - gpu-cluster
    restart: unless-stopped

  # ── Vision / OCR Server ──────────────────────────────────
  vision:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: syntexa-vision
    runtime: nvidia
    ports:
      - "8002:8002"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_MODE=vision
    volumes:
      - vllm-models:/root/.cache/huggingface
    command: >
      uvicorn main:vision_app
      --host 0.0.0.0
      --port 8002
      --workers 1
    networks:
      - gpu-cluster
    restart: unless-stopped

  # ── Voice Server (STT + TTS) ─────────────────────────────
  voice:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: syntexa-voice
    runtime: nvidia
    ports:
      - "8003:8003"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_MODE=voice
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-large-v3}
      - TTS_MODEL=${TTS_MODEL:-piper}
    volumes:
      - vllm-models:/root/.cache/huggingface
      - voice-cache:/app/voice-cache
    command: >
      uvicorn main:voice_app
      --host 0.0.0.0
      --port 8003
      --workers 1
    networks:
      - gpu-cluster
    restart: unless-stopped

  # ── NGINX Load Balancer (interno) ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: syntexa-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.gpu.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm
      - embeddings
      - vision
      - voice
    networks:
      - gpu-cluster
    restart: unless-stopped

  # ── GPU Metrics Exporter ─────────────────────────────────
  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: syntexa-dcgm
    runtime: nvidia
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - gpu-cluster
    restart: unless-stopped

volumes:
  vllm-models:
  voice-cache:

networks:
  gpu-cluster:
    driver: bridge
