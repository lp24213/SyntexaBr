name = "whatsapp-gateway"
type = "service"
main = "worker.ts"
compatibility_date = "2024-01-01"

# Configuração de deploy
routes = [
  { pattern = "whatsapp.syntexabr.com.br/*", zone_name = "syntexabr.com.br" }
]

[env.production]
routes = [
  { pattern = "whatsapp.syntexabr.com.br/*", zone_name = "syntexabr.com.br" }
]

[env.staging]
routes = [
  { pattern = "whatsapp-staging.syntexabr.com.br/*", zone_name = "syntexabr.com.br" }
]

# Environment variables
[env.production.vars]
WHATSAPP_BACKEND_URL = "https://api-whatsapp.syntexabr.com.br"
WHATSAPP_VERIFY_TOKEN = "prod-verify-token"

[env.staging.vars]
WHATSAPP_BACKEND_URL = "http://localhost:3001"
WHATSAPP_VERIFY_TOKEN = "staging-verify-token"

# Secrets (use: wrangler secret put WHATSAPP_APP_SECRET --env production)
# WHATSAPP_APP_SECRET = "from secrets"

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "whatsapp-rate-limit-prod"
preview_id = "whatsapp-rate-limit-preview"

# Analytics Engine for logging
[analytics]
enabled = true

