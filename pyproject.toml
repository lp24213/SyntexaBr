[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntexa-sovereign-ai"
version = "1.0.0"
description = "SyntexaBR Sovereign Quantum AI — Hybrid AI + Quantum Computational Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "SyntexaBR", email = "dev@syntexabr.com.br"}
]
keywords = ["ai", "llm", "quantum", "orchestration", "multi-agent", "sovereign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
    "datasets>=2.14.0",
    "tokenizers>=0.15.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.24.0",
    "safetensors>=0.4.0",
    
    # Server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "starlette>=0.32.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "aioredis>=2.0.1",
    "celery>=5.3.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.0",
    "chromadb>=0.4.18",
    "faiss-cpu>=1.7.4",
    "redis>=5.0.0",
    "pgvector>=0.2.4",
    
    # Quantum
    "pyqpanda3>=3.0.0",
    "qiskit>=0.45.0",
    "pennylane>=0.33.0",
    
    # Vision / Audio
    "pillow>=10.1.0",
    "opencv-python>=4.8.0",
    "openai-whisper>=20231117",
    "TTS>=0.22.0",
    "piper-tts>=1.2.0",
    
    # Observability
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "structlog>=23.2.0",
    
    # Utils
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "msgpack>=1.0.7",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "nvidia-ml-py>=12.535.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
syntexa-server = "api.main:main"
syntexa-train = "training-pipeline.train:main"
syntexa-benchmark = "benchmarks.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "config*", "api*", "routes*", "models*", "services*", "database*", "security*", "middleware*", "llm-runtime*", "quantum-core*", "agents*", "memory*", "streaming*", "vision*", "audio*", "training-pipeline*", "benchmarks*", "utils*", "tests*"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
