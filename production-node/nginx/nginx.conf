user  nginx;
worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"bytes_sent":$bytes_sent,"referer":"$http_referer","ua":"$http_user_agent"}';

  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Anti-503: limites de taxa e conexão na borda.
  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  include /etc/nginx/conf.d/*.conf;
}
