services:
  redis:
    image: redis:7.4-alpine
    container_name: syntexa-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [syntexa]

  stt-service:
    build:
      context: ./worker-stt
      dockerfile: Dockerfile
    container_name: syntexa-stt-service
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-float16}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - STT_LANGUAGE=${STT_LANGUAGE:-pt}
    volumes:
      - uploads_data:/data/uploads
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [syntexa]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: syntexa-api
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/data/uploads
      - WS_CORS_ORIGIN=${WS_CORS_ORIGIN:-https://syntexabr.com.br}
      - API_RATE_LIMIT_WINDOW_MS=60000
      - API_RATE_LIMIT_MAX=120
      - QUEUE_NAME=stt_jobs
      - QUEUE_EVENTS_CHANNEL=stt_events
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [syntexa]

  queue-worker:
    build:
      context: ./queue-worker
      dockerfile: Dockerfile
    container_name: syntexa-queue-worker
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - STT_SERVICE_URL=http://stt-service:8001
      - QUEUE_NAME=stt_jobs
      - QUEUE_EVENTS_CHANNEL=stt_events
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - STT_TIMEOUT_MS=${STT_TIMEOUT_MS:-240000}
      - MAX_JOB_ATTEMPTS=${MAX_JOB_ATTEMPTS:-3}
      - JOB_BACKOFF_MS=${JOB_BACKOFF_MS:-5000}
    depends_on:
      redis:
        condition: service_healthy
      stt-service:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped
    networks: [syntexa]

  nginx:
    image: nginx:1.27-alpine
    container_name: syntexa-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [syntexa]

volumes:
  redis_data:
  uploads_data:
  model_cache:

networks:
  syntexa:
    driver: bridge
