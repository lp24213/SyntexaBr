# Ollama na VM de produção (Azure): CPU/GPU do próprio servidor; porta 11434 no host para o FastAPI.
# - Para throughput, aumente OLLAMA_NUM_PARALLEL conforme RAM/CPU/GPU.
# - Para estabilidade sob pico, mantenha MAX_LOADED_MODELS baixo.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: syntexa-ollama
    ports:
      - "11434:11434"
    environment:
      # Ajuste fino:
      # - 1: máximo de estabilidade, menor throughput
      # - 2-4: melhor throughput se o VPS aguentar (RAM/CPU/GPU)
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Primeira vez no servidor (exemplos):
    #   docker exec -it syntexa-ollama ollama pull llama3.1:8b
    #   docker exec -it syntexa-ollama ollama pull llama3.1:70b
    #   docker exec -it syntexa-ollama ollama pull llava:7b

networks:
  default:
    name: syntexa-llm-net

volumes:
  ollama_data: {}

