version: "3.9"

# Stack completa (paralela ao runtime atual):
# - mantém backend/API
# - sobe runtime da IA própria
# - sobe gateway Node para integração
# - redis opcional para fila/cache
services:
  redis:
    image: redis:7.4-alpine
    container_name: syntexa-own-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - syntexa_own_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  own-model:
    build:
      context: .
      dockerfile: docker/own-model/Dockerfile
    container_name: syntexa-own-model
    env_file:
      - .env
    environment:
      OWN_MODEL_MAX_NEW_TOKENS: ${OWN_MODEL_MAX_NEW_TOKENS:-1536}
      OWN_MODEL_TEMPERATURE: ${OWN_MODEL_TEMPERATURE:-0.82}
      OWN_MODEL_TOP_K: ${OWN_MODEL_TOP_K:-96}
    command:
      - python
      - training/serve_model.py
      - --checkpoint
      - /app/checkpoints/syntexa_small/manifest.json
      - --host
      - 0.0.0.0
      - --port
      - "9000"
      - --device
      - cpu
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./config:/app/config
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  own-model-gateway:
    image: node:20-alpine
    container_name: syntexa-own-model-gateway
    working_dir: /app
    environment:
      OWN_MODEL_GATEWAY_PORT: "9010"
      OWN_MODEL_UPSTREAM: "http://own-model:9000"
    command: ["node", "production-node/own-model-gateway/server.js"]
    volumes:
      - ./:/app
    depends_on:
      own-model:
        condition: service_healthy
    ports:
      - "9010:9010"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syntexa-backend-own-stack
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      LOCAL_LLM_ENDPOINT: http://own-model-gateway:9010
      LOCAL_HTTP_LLM_MODEL: syntexa_small
    command: ["/bin/bash", "scripts/run_uvicorn_prod.sh"]
    depends_on:
      redis:
        condition: service_healthy
      own-model-gateway:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped
  
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: syntexa-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - syntexa_prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
      alertmanager:
        condition: service_started
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: syntexa-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:65535/disabled}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.5
    container_name: syntexa-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - syntexa_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  syntexa_own_redis: {}
  syntexa_prometheus_data: {}
  syntexa_grafana_data: {}
