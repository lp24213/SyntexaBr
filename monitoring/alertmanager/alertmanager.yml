global:
  resolve_timeout: 5m

route:
  receiver: webhook-primary
  group_by: ["alertname", "service"]
  group_wait: 20s
  group_interval: 2m
  repeat_interval: 30m

receivers:
  - name: default-log
  - name: webhook-primary
    webhook_configs:
      - url: ${ALERT_WEBHOOK_URL}
        send_resolved: true
